version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  be:dev:
    desc: Run local FastAPI gateway and choose read-only or executable mode
    cmds:
      - ./scripts/dev-gateway-lightspeed.sh

  fe:dev:
    desc: Run local console plugin dev server connected to the local gateway
    cmds:
      - ./scripts/dev-console-plugin.sh

  catalog:package:
    desc: Package the Helm chart and generate a Software Catalog repository index
    cmds:
      - ./scripts/software-catalog-helm.sh package

  catalog:runtime:apply:
    desc: Apply gateway, action executor, and diagnostics runtime prerequisites for catalog installs
    cmds:
      - oc apply -k openshift/overlays/${KOMSCO_AIOPS_ENV:-prod}

  catalog:serve:
    desc: Serve the generated Helm chart repository for local catalog checks
    cmds:
      - ./scripts/software-catalog-helm.sh serve

  catalog:register:
    desc: Register the Helm repository in OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh register

  catalog:unregister:
    desc: Remove the Helm repository from OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh unregister

  catalog:deploy:
    desc: Install or upgrade the catalog chart with Helm, matching Software Catalog release behavior
    cmds:
      - ./scripts/software-catalog-helm.sh deploy

  catalog:status:
    desc: Show Software Catalog registration and deployed AIOps runtime status
    cmds:
      - ./scripts/software-catalog-helm.sh status

  catalog:release:
    desc: Apply runtime prerequisites, package/register the catalog chart, and install or upgrade the release
    cmds:
      - task: catalog:runtime:apply
      - task: catalog:package
      - task: catalog:register
      - task: catalog:deploy

  olm:package:
    desc: Generate OLM bundle, ConfigMap catalog, Subscription, and AIOpsInstallation manifests
    cmds:
      - ./scripts/olm-deploy.sh package

  olm:catalog:
    desc: Register the KOMSCO AIOps Operator in OLM OperatorHub via CatalogSource
    cmds:
      - ./scripts/olm-deploy.sh catalog

  olm:install:
    desc: Install or update KOMSCO AIOps through OLM Subscription and AIOpsInstallation
    cmds:
      - ./scripts/olm-deploy.sh install

  olm:deploy:
    desc: "One-shot official OLM deployment: catalog, subscription, installation, and rollout wait"
    cmds:
      - ./scripts/olm-deploy.sh deploy

  olm:release:
    desc: Build/push release images, then install or update through official OLM
    cmds:
      - ./scripts/olm-release-images.sh deploy

  olm:images:
    desc: Build and push OLM release images without installing the operator
    cmds:
      - ./scripts/olm-release-images.sh build-push

  olm:status:
    desc: Show OLM catalog, subscription, CSV, AIOpsInstallation, and operand status
    cmds:
      - ./scripts/olm-deploy.sh status

  olm:reset-install:
    desc: Remove the installed AIOps runtime and operator while keeping the OLM catalog visible
    cmds:
      - ./scripts/olm-deploy.sh reset-install

  olm:uninstall:
    desc: Remove OLM subscription/catalog resources and the AIOpsInstallation custom resource
    cmds:
      - ./scripts/olm-deploy.sh uninstall

  kugnus:package:
    desc: Generate and verify the Kugnus OLM catalog package with deterministic internal image refs
    cmds:
      - ./scripts/kugnus-olm.sh package

  kugnus:images:
    desc: Build and push Kugnus gateway/operator and console plugin images only when KOMSCO_AIOPS_APPROVE_IMAGES=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh images

  kugnus:publish:
    desc: Build Kugnus images and register only the Kugnus OLM CatalogSource only when KOMSCO_AIOPS_APPROVE_PUBLISH=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh publish

  kugnus:install:
    desc: Install Kugnus Subscription and AIOpsInstallation only when KOMSCO_AIOPS_APPROVE_INSTALL=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh install

  kugnus:uninstall:
    desc: Remove only Kugnus catalog/install/runtime resources when KOMSCO_AIOPS_APPROVE_UNINSTALL=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh uninstall

  kugnus:status:
    desc: Show local Kugnus package readiness by default; set KOMSCO_AIOPS_STATUS_MODE=cluster for cluster reads
    cmds:
      - ./scripts/kugnus-olm.sh status

  kugnus:evaluate:
    desc: Run Ver.0.1.3 offline AIOps scenario evaluator and write a pass/fail report
    cmds:
      - python3 scripts/evaluate-aiops-scenarios.py --scenarios evals/aiops-scenarios --report docs/Ver.0.1.3/aiops-scenario-evaluation-report.json

  kugnus:scenario:verify:
    desc: Verify the Ver.0.1.3 ten-scenario operations contract without cluster access
    cmds:
      - task: kugnus:evaluate

  kugnus:stage6:verify:
    desc: Run Ver.0.1.2 Stage 6 local verification without OCP install/deploy/mutation
    cmds:
      - ./scripts/kugnus-stage6-verify.sh

  kugnus:dev:be:
    desc: Run executable Gateway on 0.0.0.0 so the Docker local console can reach it from WSL
    cmds:
      - GATEWAY_HOST=0.0.0.0 OLS_BASE_URL=https://127.0.0.1:18443 AIOPS_GATEWAY_MODE="${AIOPS_GATEWAY_MODE:-execute}" ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:read-only:
    desc: Run Gateway in read-only mode for safe observation
    cmds:
      - GATEWAY_HOST=0.0.0.0 OLS_BASE_URL=https://127.0.0.1:18443 AIOPS_GATEWAY_MODE=read-only ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:execute:
    desc: Run Gateway in approved execution mode with Action Executor port-forward
    cmds:
      - GATEWAY_HOST=0.0.0.0 OLS_BASE_URL=https://127.0.0.1:18443 AIOPS_GATEWAY_MODE=execute ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:unrestricted:
    desc: Run Gateway in local lab unrestricted mode so all three UI execution modes are selectable
    cmds:
      - GATEWAY_HOST=0.0.0.0 OLS_BASE_URL=https://127.0.0.1:18443 AIOPS_GATEWAY_MODE=unrestricted ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:fe:
    desc: Run local console bridge using the current WSL IP as Gateway endpoint
    cmds:
      - GATEWAY_ENDPOINT="http://$(hostname -I | awk '{print $1}'):18080" ./scripts/dev-console-plugin.sh

  kugnus:dev:doctor:
    desc: Diagnose WSL, Node, oc, Docker, ports, backend, and console readiness without changing state
    cmds:
      - bash ./scripts/kugnus-dev-doctor.sh

  kugnus:runtime:smoke:
    desc: Verify local Gateway auth, OCP summary, overview, runbook, and RAG contract through WSL oc token
    cmds:
      - bash ./scripts/kugnus-runtime-smoke.sh

  kugnus:rag:dev:up:
    desc: Start local PostgreSQL pgvector backend for RAG demo and print Gateway env
    cmds:
      - bash ./scripts/kugnus-rag-pgvector-dev.sh

  kugnus:rag:upload:smoke:
    desc: Upload a user RAG document, verify pgvector persistence, list, and search retrieval
    cmds:
      - bash ./scripts/kugnus-rag-upload-smoke.sh

  kugnus:rag:file-upload:smoke:
    desc: Upload a PDF through multipart RAG ingestion and verify parser, chunks, and pgvector persistence
    cmds:
      - komsco-ai-gateway/.venv/bin/python scripts/kugnus-rag-file-upload-smoke.py

  kugnus:rag:chat:smoke:
    desc: Verify chat SSE exposes retrieved RAG evidence and answer citation text
    cmds:
      - bash ./scripts/kugnus-rag-chat-citation-smoke.sh

  kugnus:dev:be:execute:rag:
    desc: Run executable Gateway with the local pgvector RAG demo backend
    cmds:
      - KOMSCO_AI_RAG_BACKEND_URL=postgresql://komsco_aiops@127.0.0.1:15432/komsco_aiops KOMSCO_AI_RAG_EMBEDDING_MODEL=hashing-bow-v1 KOMSCO_AI_RAG_VECTOR_DIMENSIONS=64 GATEWAY_HOST=0.0.0.0 OLS_BASE_URL=https://127.0.0.1:18443 AIOPS_GATEWAY_MODE=execute ./scripts/dev-gateway-lightspeed.sh

  kugnus:stage1:verify:
    desc: Verify local Stage 1 evidence/RCA context events and write a JSON evidence report
    cmds:
      - python3 scripts/verify-stage1-evidence-rca.py --report docs/Ver.0.1.1/stage-1-evidence-rca-context-verification.json || python scripts/verify-stage1-evidence-rca.py --report docs/Ver.0.1.1/stage-1-evidence-rca-context-verification.json

  kugnus:ui:verify:
    desc: Verify local Cywell AI chat UI layout, header, sidebar, fullscreen, and resize controls
    cmds:
      - bash -ic 'node ./scripts/verify-kugnus-ui.mjs'

  kugnus:demo:verify:
    desc: Verify Ver.0.1.3 CrashLoopBackOff demo-cycle source and RCA context contract without OCP mutation
    cmds:
      - python3 scripts/verify-crashloop-demo-cycle.py --report docs/Ver.0.1.3/crashloop-demo-cycle-verification.json || python scripts/verify-crashloop-demo-cycle.py --report docs/Ver.0.1.3/crashloop-demo-cycle-verification.json

  kugnus:demo:live-verify:
    desc: Verify Ver.0.1.3 CrashLoopBackOff demo-cycle against the local controlled-execution gateway
    cmds:
      - python3 scripts/verify-crashloop-live-demo-cycle.py --report docs/Ver.0.1.3/crashloop-live-demo-cycle-verification.json

  kugnus:demo:screen-readiness:
    desc: Verify Ver.0.1.3 CrashLoopBackOff screen-cycle readiness without browser mutation
    cmds:
      - python3 scripts/verify-crashloop-screen-cycle-readiness.py --report docs/Ver.0.1.3/crashloop-screen-cycle-readiness-verification.json

  kugnus:evidence-rca:verify:
    desc: Verify the official Ver.0.1.3 Evidence RCA demo scene contract without cluster mutation
    cmds:
      - komsco-ai-gateway/.venv/bin/python scripts/verify-evidence-rca-scene.py --report docs/Ver.0.1.3/evidence-rca-scene-verification.json

  kugnus:evidence-rca:browser-verify:
    desc: Capture browser proof that the local console stages the official Ver.0.1.3 Evidence RCA question
    cmds:
      - bash -ic 'cd komsco-ai-console-plugin && rm -rf integration-tests/screenshots/screenshots/official-evidence-rca.cy.ts && BRIDGE_BASE_ADDRESS=http://localhost:9000/ node --max-old-space-size=4096 ./node_modules/.bin/cypress run --browser electron --spec integration-tests/tests/official-evidence-rca.cy.ts'
      - python3 scripts/collect-official-evidence-rca-browser-report.py --report docs/Ver.0.1.3/official-evidence-rca-browser-verification.json --screenshot docs/Ver.0.1.3/official-evidence-rca-browser-screen.png
