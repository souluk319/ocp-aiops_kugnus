version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  be:dev:
    desc: Run local FastAPI gateway and choose read-only or executable mode
    cmds:
      - ./scripts/dev-gateway-lightspeed.sh

  fe:dev:
    desc: Run local console plugin dev server connected to the local gateway
    cmds:
      - ./scripts/dev-console-plugin.sh

  catalog:package:
    desc: Package the Helm chart and generate a Software Catalog repository index
    cmds:
      - ./scripts/software-catalog-helm.sh package

  catalog:runtime:apply:
    desc: Apply gateway, action executor, and diagnostics runtime prerequisites for catalog installs
    cmds:
      - oc apply -k openshift/overlays/${KOMSCO_AIOPS_ENV:-prod}

  catalog:serve:
    desc: Serve the generated Helm chart repository for local catalog checks
    cmds:
      - ./scripts/software-catalog-helm.sh serve

  catalog:register:
    desc: Register the Helm repository in OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh register

  catalog:unregister:
    desc: Remove the Helm repository from OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh unregister

  catalog:deploy:
    desc: Install or upgrade the catalog chart with Helm, matching Software Catalog release behavior
    cmds:
      - ./scripts/software-catalog-helm.sh deploy

  catalog:status:
    desc: Show Software Catalog registration and deployed AIOps runtime status
    cmds:
      - ./scripts/software-catalog-helm.sh status

  catalog:release:
    desc: Apply runtime prerequisites, package/register the catalog chart, and install or upgrade the release
    cmds:
      - task: catalog:runtime:apply
      - task: catalog:package
      - task: catalog:register
      - task: catalog:deploy

  olm:package:
    desc: Generate OLM bundle, ConfigMap catalog, Subscription, and AIOpsInstallation manifests
    cmds:
      - ./scripts/olm-deploy.sh package

  olm:catalog:
    desc: Register the KOMSCO AIOps Operator in OLM OperatorHub via CatalogSource
    cmds:
      - ./scripts/olm-deploy.sh catalog

  olm:install:
    desc: Install or update KOMSCO AIOps through OLM Subscription and AIOpsInstallation
    cmds:
      - ./scripts/olm-deploy.sh install

  olm:deploy:
    desc: "One-shot official OLM deployment: catalog, subscription, installation, and rollout wait"
    cmds:
      - ./scripts/olm-deploy.sh deploy

  olm:release:
    desc: Build/push release images, then install or update through official OLM
    cmds:
      - ./scripts/olm-release-images.sh deploy

  olm:images:
    desc: Build and push OLM release images without installing the operator
    cmds:
      - ./scripts/olm-release-images.sh build-push

  olm:status:
    desc: Show OLM catalog, subscription, CSV, AIOpsInstallation, and operand status
    cmds:
      - ./scripts/olm-deploy.sh status

  olm:reset-install:
    desc: Remove the installed AIOps runtime and operator while keeping the OLM catalog visible
    cmds:
      - ./scripts/olm-deploy.sh reset-install

  olm:uninstall:
    desc: Remove OLM subscription/catalog resources and the AIOpsInstallation custom resource
    cmds:
      - ./scripts/olm-deploy.sh uninstall

  kugnus:package:
    desc: Generate and verify the Kugnus OLM catalog package with deterministic internal image refs
    cmds:
      - ./scripts/kugnus-olm.sh package

  kugnus:images:
    desc: Build and push Kugnus gateway/operator and console plugin images only when KOMSCO_AIOPS_APPROVE_IMAGES=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh images

  kugnus:publish:
    desc: Build Kugnus images and register only the Kugnus OLM CatalogSource only when KOMSCO_AIOPS_APPROVE_PUBLISH=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh publish

  kugnus:install:
    desc: Install Kugnus Subscription and AIOpsInstallation only when KOMSCO_AIOPS_APPROVE_INSTALL=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh install

  kugnus:uninstall:
    desc: Remove only Kugnus catalog/install/runtime resources when KOMSCO_AIOPS_APPROVE_UNINSTALL=komsco-ai-kugnus
    cmds:
      - ./scripts/kugnus-olm.sh uninstall

  kugnus:status:
    desc: Show local Kugnus package readiness by default; set KOMSCO_AIOPS_STATUS_MODE=cluster for cluster reads
    cmds:
      - ./scripts/kugnus-olm.sh status

  kugnus:ui:verify:
    desc: Verify local Cywell AI chat UI layout, header, sidebar, fullscreen, and resize controls
    cmds:
      - node ./scripts/verify-kugnus-ui.mjs
