version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  be:dev:
    desc: Run local FastAPI gateway connected to OpenShift Lightspeed
    cmds:
      - ./scripts/dev-gateway-lightspeed.sh

  be:dev:exec:
    desc: Run local FastAPI gateway with the cluster Action Executor enabled
    cmds:
      - KOMSCO_AI_ENABLE_MUTATIONS=true ACTION_EXECUTOR_PORT_FORWARD=true KOMSCO_AI_SECURITY_PHASE=phase5-action-execution ./scripts/dev-gateway-lightspeed.sh

  fe:dev:
    desc: Run local console plugin dev server connected to the local gateway
    cmds:
      - ./scripts/dev-console-plugin.sh
