version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  be:dev:
    desc: Run local FastAPI gateway and choose read-only or executable mode
    cmds:
      - ./scripts/dev-gateway-lightspeed.sh

  fe:dev:
    desc: Run local console plugin dev server connected to the local gateway
    cmds:
      - ./scripts/dev-console-plugin.sh

  portal:dev:
    desc: Run standalone React AIOps for OCP portal SPA connected to the local gateway
    dir: komsco-ai-portal
    cmds:
      - npm install
      - AIOPS_DEV_OPENSHIFT_TOKEN="$(oc whoami -t)" npm run dev

  portal:build:
    desc: Build standalone React AIOps for OCP portal SPA
    dir: komsco-ai-portal
    cmds:
      - npm install
      - npm run build

  catalog:package:
    desc: Package the Helm chart and generate a Software Catalog repository index
    cmds:
      - ./scripts/software-catalog-helm.sh package

  catalog:runtime:apply:
    desc: Apply gateway, action executor, and diagnostics runtime prerequisites for catalog installs
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        test "${KOMSCO_AIOPS_APPROVE_RUNTIME_APPLY:-}" = "cywell-aiops" || { echo "Refusing runtime apply. Re-run with KOMSCO_AIOPS_APPROVE_RUNTIME_APPLY=cywell-aiops after explicit approval." >&2; exit 1; }
        oc apply -k openshift/overlays/${KOMSCO_AIOPS_ENV:-prod}

  catalog:serve:
    desc: Serve the generated Helm chart repository for local catalog checks
    cmds:
      - ./scripts/software-catalog-helm.sh serve

  catalog:register:
    desc: Register the Helm repository in OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh register

  catalog:unregister:
    desc: Remove the Helm repository from OpenShift Software Catalog
    cmds:
      - ./scripts/software-catalog-helm.sh unregister

  catalog:deploy:
    desc: Install or upgrade the catalog chart with Helm, matching Software Catalog release behavior
    cmds:
      - ./scripts/software-catalog-helm.sh deploy

  catalog:status:
    desc: Show Software Catalog registration and deployed AIOps runtime status
    cmds:
      - ./scripts/software-catalog-helm.sh status

  catalog:release:
    desc: Apply runtime prerequisites, package/register the catalog chart, and install or upgrade the release
    cmds:
      - task: catalog:runtime:apply
      - task: catalog:package
      - task: catalog:register
      - task: catalog:deploy

  olm:package:
    desc: Generate OLM bundle, ConfigMap catalog, Subscription, and AIOpsInstallation manifests
    cmds:
      - ./scripts/olm-deploy.sh package

  olm:catalog:
    desc: Register the KOMSCO AIOps Operator in OLM OperatorHub via CatalogSource
    cmds:
      - ./scripts/olm-deploy.sh catalog

  olm:install:
    desc: Install or update KOMSCO AIOps through OLM Subscription and AIOpsInstallation
    cmds:
      - ./scripts/olm-deploy.sh install

  olm:deploy:
    desc: "One-shot official OLM deployment: catalog, subscription, installation, and rollout wait"
    cmds:
      - ./scripts/olm-deploy.sh deploy

  olm:release:
    desc: Build/push release images, then install or update through official OLM
    cmds:
      - ./scripts/olm-release-images.sh deploy

  olm:images:
    desc: Build and push OLM release images without installing the operator
    cmds:
      - ./scripts/olm-release-images.sh build-push

  olm:status:
    desc: Show OLM catalog, subscription, CSV, AIOpsInstallation, and operand status
    cmds:
      - ./scripts/olm-deploy.sh status

  olm:reset-install:
    desc: Remove the installed AIOps runtime and operator while keeping the OLM catalog visible
    cmds:
      - ./scripts/olm-deploy.sh reset-install

  olm:uninstall:
    desc: Remove OLM subscription/catalog resources and the AIOpsInstallation custom resource
    cmds:
      - ./scripts/olm-deploy.sh uninstall

  aiops:package:
    desc: Generate and verify the AIOps OLM catalog package with deterministic internal image refs
    cmds:
      - ./scripts/kugnus-olm.sh package

  aiops:images:
    desc: Build and push AIOps gateway/operator and console plugin images only when KOMSCO_AIOPS_APPROVE_IMAGES=cywell-aiops
    cmds:
      - ./scripts/kugnus-olm.sh images

  aiops:publish:
    desc: Build AIOps images and register only the AIOps OLM CatalogSource only when KOMSCO_AIOPS_APPROVE_PUBLISH=cywell-aiops
    cmds:
      - ./scripts/kugnus-olm.sh publish

  aiops:install:
    desc: Install AIOps Subscription and AIOpsInstallation only when KOMSCO_AIOPS_APPROVE_INSTALL=cywell-aiops
    cmds:
      - ./scripts/kugnus-olm.sh install

  aiops:uninstall:
    desc: Remove only AIOps catalog/install/runtime resources when KOMSCO_AIOPS_APPROVE_UNINSTALL=cywell-aiops
    cmds:
      - ./scripts/kugnus-olm.sh uninstall

  aiops:status:
    desc: Show local AIOps package readiness by default; set KOMSCO_AIOPS_STATUS_MODE=cluster for cluster reads
    cmds:
      - ./scripts/kugnus-olm.sh status

  aiops:company:check:
    desc: Check target cluster identity and local AIOps OLM package before company catalog work
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        ./scripts/kugnus-olm.sh preflight
        ./scripts/kugnus-olm.sh package

  aiops:company:publish:
    desc: Build images and publish the AIOps OperatorHub catalog entry to the approved company server
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        KOMSCO_AIOPS_IMAGE_BUILD_STRATEGY=openshift KOMSCO_AIOPS_FORCE_IMAGE_BUILD="${KOMSCO_AIOPS_FORCE_IMAGE_BUILD:-true}" KOMSCO_AIOPS_APPROVE_PUBLISH=cywell-aiops ./scripts/kugnus-olm.sh publish

  aiops:company:install:
    desc: Create the Manual AIOps Subscription and stop for InstallPlan review
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        KOMSCO_AIOPS_APPROVE_INSTALL=cywell-aiops ./scripts/kugnus-olm.sh install

  aiops:company:approve-install:
    desc: Approve the reviewed AIOps Manual InstallPlan and complete the company rollout
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        KOMSCO_AIOPS_APPROVE_INSTALL_PLAN=cywell-aiops ./scripts/kugnus-olm.sh approve-install

  aiops:company:rollback:
    desc: Restore the verified pre-0.1.17 company backup after an explicitly declared rollout failure
    cmds:
      - ./scripts/kugnus-company-rollback.sh

  aiops:company:status:
    desc: Show AIOps catalog, install, and ConsolePlugin status on the approved company server
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        echo "target=${server}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        KOMSCO_AIOPS_STATUS_MODE=cluster ./scripts/kugnus-olm.sh status

  aiops:company:redeploy:
    desc: Rebuild/publish current code, then restart installed Gateway and console plugin pods on the approved company server
    cmds:
      - |
        server="$(oc whoami --show-server)"
        expected="${KOMSCO_AIOPS_COMPANY_SERVER:-https://api.ocp.cywell.server:6443}"
        namespace="${KOMSCO_AIOPS_NAMESPACE:-cywell-aiops}"
        operator="${KOMSCO_AIOPS_OPERATOR_NAME:-cywell-aiops-operator}"
        echo "target=${server}"
        echo "namespace=${namespace}"
        test "$server" = "$expected" || { echo "Refusing: expected ${expected}" >&2; exit 1; }
        test "${KOMSCO_AIOPS_APPROVE_REDEPLOY:-}" = "cywell-aiops" || { echo "Refusing redeploy. Re-run with KOMSCO_AIOPS_APPROVE_REDEPLOY=cywell-aiops after explicit approval." >&2; exit 1; }
        KOMSCO_AIOPS_IMAGE_BUILD_STRATEGY=openshift KOMSCO_AIOPS_FORCE_IMAGE_BUILD="${KOMSCO_AIOPS_FORCE_IMAGE_BUILD:-true}" KOMSCO_AIOPS_APPROVE_PUBLISH=cywell-aiops ./scripts/kugnus-olm.sh publish
        oc rollout restart deployment/"${operator}" -n "${namespace}"
        oc rollout status deployment/"${operator}" -n "${namespace}" --timeout=180s
        oc rollout restart deployment/komsco-ai-console-plugin -n "${namespace}"
        oc rollout status deployment/komsco-ai-console-plugin -n "${namespace}" --timeout=300s
        oc rollout restart deployment/komsco-ai-gateway -n "${namespace}"
        oc rollout status deployment/komsco-ai-gateway -n "${namespace}" --timeout=300s
        KOMSCO_AIOPS_STATUS_MODE=cluster ./scripts/kugnus-olm.sh status

  kugnus:package:
    desc: Compatibility alias for aiops:package
    cmds:
      - task: aiops:package

  kugnus:images:
    desc: Compatibility alias for aiops:images
    cmds:
      - task: aiops:images

  kugnus:publish:
    desc: Compatibility alias for aiops:publish
    cmds:
      - task: aiops:publish

  kugnus:install:
    desc: Compatibility alias for aiops:install
    cmds:
      - task: aiops:install

  kugnus:uninstall:
    desc: Compatibility alias for aiops:uninstall
    cmds:
      - task: aiops:uninstall

  kugnus:status:
    desc: Compatibility alias for aiops:status
    cmds:
      - task: aiops:status

  kugnus:company:check:
    desc: Compatibility alias for aiops:company:check
    cmds:
      - task: aiops:company:check

  kugnus:company:publish:
    desc: Compatibility alias for aiops:company:publish
    cmds:
      - task: aiops:company:publish

  kugnus:company:install:
    desc: Compatibility alias for aiops:company:install
    cmds:
      - task: aiops:company:install

  kugnus:company:approve-install:
    desc: Compatibility alias for aiops:company:approve-install
    cmds:
      - task: aiops:company:approve-install

  kugnus:company:rollback:
    desc: Compatibility alias for aiops:company:rollback
    cmds:
      - task: aiops:company:rollback

  kugnus:company:status:
    desc: Compatibility alias for aiops:company:status
    cmds:
      - task: aiops:company:status

  kugnus:company:redeploy:
    desc: Compatibility alias for aiops:company:redeploy
    cmds:
      - task: aiops:company:redeploy

  kugnus:gateway:restart:
    desc: Restart local AIOps Gateway with Lightspeed
    cmds:
      - pkill -f "uvicorn komsco_ai_gateway.main:app" || true
      - GATEWAY_HOST=127.0.0.1 AIOPS_GATEWAY_MODE=execute ./scripts/dev-gateway-lightspeed.sh

  kugnus:evaluate:
    desc: Run Ver.0.1.3 offline AIOps scenario evaluator and write a pass/fail report
    cmds:
      - python3 scripts/evaluate-aiops-scenarios.py --scenarios evals/aiops-scenarios --report docs/Ver.0.1.3/aiops-scenario-evaluation-report.json

  kugnus:scenario:verify:
    desc: Verify the Ver.0.1.3 thirteen-scenario operations contract without cluster access
    cmds:
      - task: kugnus:evaluate

  kugnus:stage6:verify:
    desc: Run Ver.0.1.2 Stage 6 local verification without OCP install/deploy/mutation
    cmds:
      - ./scripts/kugnus-stage6-verify.sh

  kugnus:dev:be:
    desc: Run executable Gateway on 0.0.0.0 so the Docker local console can reach it from WSL
    cmds:
      - GATEWAY_HOST="${GATEWAY_HOST:-0.0.0.0}" OLS_BASE_URL="${OLS_BASE_URL:-https://127.0.0.1:18443}" AIOPS_GATEWAY_MODE="${AIOPS_GATEWAY_MODE:-execute}" ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:read-only:
    desc: Run Gateway in read-only mode for safe observation
    cmds:
      - GATEWAY_HOST="${GATEWAY_HOST:-0.0.0.0}" OLS_BASE_URL="${OLS_BASE_URL:-https://127.0.0.1:18443}" AIOPS_GATEWAY_MODE=read-only ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:execute:
    desc: Run Gateway in approved execution mode with Action Executor port-forward
    cmds:
      - GATEWAY_HOST="${GATEWAY_HOST:-0.0.0.0}" OLS_BASE_URL="${OLS_BASE_URL:-https://127.0.0.1:18443}" AIOPS_GATEWAY_MODE=execute ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:be:unrestricted:
    desc: Run Gateway in local lab unrestricted mode so all three UI execution modes are selectable
    cmds:
      - GATEWAY_HOST="${GATEWAY_HOST:-0.0.0.0}" OLS_BASE_URL="${OLS_BASE_URL:-https://127.0.0.1:18443}" AIOPS_GATEWAY_MODE=unrestricted ./scripts/dev-gateway-lightspeed.sh

  kugnus:dev:fe:
    desc: Run local console bridge with Docker-safe Gateway endpoint normalization
    cmds:
      - ./scripts/dev-console-plugin.sh

  kugnus:dev:console:open:
    desc: Repair stale local OKD console bridge, verify API health, and open the dashboard
    cmds:
      - OPEN_BROWSER=true ./scripts/open-okd-console.sh

  kugnus:dev:console:repair:
    desc: Repair stale local OKD console bridge and verify API health without opening a browser
    cmds:
      - OPEN_BROWSER=false ./scripts/open-okd-console.sh

  kugnus:dev:console:morning:
    desc: Explain, diagnose, repair, and verify the local OKD console bridge for the daily startup path
    cmds:
      - bash ./scripts/kugnus-okd-console-morning.sh

  kugnus:dev:doctor:
    desc: Diagnose WSL, Node, oc, Docker, ports, backend, and console readiness without changing state
    cmds:
      - bash ./scripts/kugnus-dev-doctor.sh

  kugnus:demo:resume:
    desc: Resume the local WSL demo stack after oc login and run smoke plus strict Lightspeed verification
    cmds:
      - bash ./scripts/kugnus-demo-resume.sh

  kugnus:dev:boot:
    desc: Start the daily local AIOps stack after PC reboot without running long strict demo gates
    cmds:
      - KUGNUS_RESUME_RUN_STRICT_GATE=false bash ./scripts/kugnus-demo-resume.sh

  kugnus:aiops:up:
    desc: Start the local OKD AIOps stack with Gateway, plugin, console, and readiness gates
    cmds:
      - KUGNUS_RESUME_RUN_STRICT_GATE=false bash ./scripts/kugnus-demo-resume.sh

  kugnus:aiops:doctor:
    desc: Explain and diagnose the local OKD AIOps stack without repair
    cmds:
      - KUGNUS_OKD_CONSOLE_REPAIR=false bash ./scripts/kugnus-okd-console-morning.sh

  kugnus:aiops:learning-dataset:
    desc: Export sanitized AIOps learning/evaluation dataset from transcripts, feedback, action records, audit, and scenario results
    cmds:
      - |
        node scripts/export-aiops-learning-dataset.cjs \
          --url "{{.GATEWAY_STATUS_URL | default "http://127.0.0.1:5174/v1/aiops/status"}}" \
          --transcripts "{{.TRANSCRIPTS | default "komsco-ai-gateway/var/aiops/chat-transcripts.jsonl"}}" \
          --scenario-report "{{.SCENARIO_REPORT | default "docs/Ver.0.1.3/aiops-scenario-evaluation-report.json"}}" \
          --output "{{.OUTPUT | default ".tmp-kugnus-demo/aiops-learning-dataset.json"}}" \
          --limit "{{.LIMIT | default "100"}}"

  kugnus:aiops:completion-audit:
    desc: Generate the official-PDF-aligned AIOps completion audit without publishing or installing
    cmds:
      - |
        node scripts/verify-v029-aiops-completion-audit.cjs \
          --output "{{.OUTPUT | default ".tmp-kugnus-demo/aiops-completion-audit.json"}}" \
          --markdown "{{.MARKDOWN | default ".tmp-kugnus-demo/aiops-completion-audit.md"}}"

  kugnus:aiops:repair:
    desc: Repair stale local OKD AIOps console, plugin, and bridge readiness
    cmds:
      - KUGNUS_OKD_CONSOLE_REPAIR=true bash ./scripts/kugnus-okd-console-morning.sh

  kugnus:demo:preflight:
    desc: Diagnose Ver.0.1.6 local demo readiness and write JSON/HTML reports without OCP mutation
    cmds:
      - python3 scripts/kugnus-demo-preflight.py

  kugnus:demo:after-vpn:
    desc: After Windows company VPN is connected, prove private route and resume the local strict demo
    cmds:
      - task: kugnus:vpn:doctor
      - task: kugnus:ocp:doctor
      - task: kugnus:demo:resume

  kugnus:demo:wait:
    desc: Wait for company OCP connectivity, then run the local demo resume loop
    cmds:
      - bash ./scripts/kugnus-demo-wait-and-resume.sh

  kugnus:vpn:doctor:
    desc: Quickly check Windows VPN/private route to company OCP before full OCP diagnostics
    cmds:
      - mkdir -p .tmp-kugnus-demo
      - python3 scripts/kugnus-ocp-connectivity-ladder.py --fast-fail --timeout "${KUGNUS_VPN_DOCTOR_TIMEOUT_SECONDS:-3}" --report .tmp-kugnus-demo/ocp-vpn-route-report.json

  kugnus:ocp:ladder:verify:
    desc: Verify OCP connectivity ladder parsing and likely-cause contracts without network access
    cmds:
      - python3 scripts/verify-ocp-connectivity-ladder-contract.py

  kugnus:ocp:doctor:
    desc: Diagnose DNS, TCP, TLS, oc identity, SSR, and local Gateway access without persisting tokens
    cmds:
      - python3 scripts/kugnus-ocp-connectivity-ladder.py

  kugnus:runtime:smoke:
    desc: Verify local Gateway auth, OCP summary, overview, runbook, and RAG contract through WSL oc token
    cmds:
      - REPORT=docs/Ver.0.1.6/runtime-smoke-report.json bash ./scripts/kugnus-runtime-smoke.sh

  kugnus:rag:dev:up:
    desc: Start local PostgreSQL pgvector backend for RAG demo and print Gateway env
    cmds:
      - bash ./scripts/kugnus-rag-pgvector-dev.sh

  kugnus:rag:upload:smoke:
    desc: Upload a user RAG document, verify pgvector persistence, list, and search retrieval
    cmds:
      - bash ./scripts/kugnus-rag-upload-smoke.sh

  kugnus:rag:file-upload:smoke:
    desc: Upload a PDF through multipart RAG ingestion and verify parser, chunks, and pgvector persistence
    cmds:
      - REPORT=docs/Ver.0.1.6/rag-file-upload-smoke-report.json KUGNUS_RAG_FILE_SMOKE_VERSION=v0.1.6 komsco-ai-gateway/.venv/bin/python scripts/kugnus-rag-file-upload-smoke.py

  kugnus:rag:mock-customer:smoke:
    desc: Build mock customer operations PDFs, upload them, and verify Gateway RAG search markers
    cmds:
      - REPORT=docs/Ver.0.1.6/rag-mock-customer-smoke-report.json komsco-ai-gateway/.venv/bin/python scripts/kugnus-rag-mock-customer-smoke.py

  kugnus:rag:chat:smoke:
    desc: Verify chat SSE exposes retrieved RAG evidence and answer citation text
    cmds:
      - REPORT=docs/Ver.0.1.6/rag-chat-citation-smoke-report.json KUGNUS_RAG_CHAT_SMOKE_RUN_ID=ver-0.1.6-rag-chat-citation-smoke bash ./scripts/kugnus-rag-chat-citation-smoke.sh

  kugnus:rag:sync:
    desc: "Sync a local directory of .md/.txt/.pdf runbooks to the Gateway RAG backend (set RAG_SYNC_DIR and TOKEN)"
    cmds:
      - |
        komsco-ai-gateway/.venv/bin/python komsco-ai-gateway/scripts/kugnus-rag-sync.py \
          --dir "{{.RAG_SYNC_DIR | default "docs/runbooks"}}" \
          --gateway-url "{{.GATEWAY_URL | default "http://localhost:18080"}}" \
          --token "{{.TOKEN}}" \
          --version "{{.RAG_VERSION | default "v0.1.7"}}"

  kugnus:rag:sync:dry-run:
    desc: "Preview what kugnus:rag:sync would upload without actually calling the Gateway"
    cmds:
      - |
        komsco-ai-gateway/.venv/bin/python komsco-ai-gateway/scripts/kugnus-rag-sync.py \
          --dir "{{.RAG_SYNC_DIR | default "docs/runbooks"}}" \
          --dry-run

  kugnus:dev:be:execute:rag:
    desc: Run executable Gateway with pgvector RAG backend (reads KOMSCO_AI_LLM_* and KOMSCO_AI_EMBEDDING_* from .env)
    cmds:
      - GATEWAY_HOST="${GATEWAY_HOST:-0.0.0.0}" OLS_BASE_URL="${OLS_BASE_URL:-https://127.0.0.1:18443}" AIOPS_GATEWAY_MODE=execute ./scripts/dev-gateway-lightspeed.sh

  kugnus:stage1:verify:
    desc: Verify local Stage 1 evidence/RCA context events and write a JSON evidence report
    cmds:
      - python3 scripts/verify-stage1-evidence-rca.py --report docs/Ver.0.1.1/stage-1-evidence-rca-context-verification.json || python scripts/verify-stage1-evidence-rca.py --report docs/Ver.0.1.1/stage-1-evidence-rca-context-verification.json

  kugnus:ui:verify:
    desc: Verify local AIOps chat UI layout, header, sidebar, fullscreen, and resize controls
    cmds:
      - bash -ic 'KUGNUS_UI_VERIFY_REPORT=docs/Ver.0.1.5/ui-verifier-report.json node ./scripts/verify-kugnus-ui.mjs'

  kugnus:demo:verify:
    desc: Verify Ver.0.1.3 CrashLoopBackOff demo-cycle source and RCA context contract without OCP mutation
    cmds:
      - python3 scripts/verify-crashloop-demo-cycle.py --report docs/Ver.0.1.3/crashloop-demo-cycle-verification.json || python scripts/verify-crashloop-demo-cycle.py --report docs/Ver.0.1.3/crashloop-demo-cycle-verification.json

  kugnus:demo:live-verify:
    desc: Verify Ver.0.1.3 CrashLoopBackOff demo-cycle against the local controlled-execution gateway
    cmds:
      - python3 scripts/verify-crashloop-live-demo-cycle.py --report docs/Ver.0.1.3/crashloop-live-demo-cycle-verification.json

  kugnus:demo:screen-readiness:
    desc: Verify Ver.0.1.3 CrashLoopBackOff screen-cycle readiness without browser mutation
    cmds:
      - python3 scripts/verify-crashloop-screen-cycle-readiness.py --report docs/Ver.0.1.3/crashloop-screen-cycle-readiness-verification.json

  kugnus:lightspeed:live-verify:
    desc: Verify current local Gateway receives final OpenShift Lightspeed answers without Gateway fallback
    cmds:
      - python3 scripts/verify-live-lightspeed-final-response.py --oc-timeout 30 --report docs/Ver.0.1.5/live-lightspeed-final-response-verification.json

  kugnus:actions:live-verify:
    desc: Verify live ActionProposal, SealedActionPlan, approval, and rejection flow without executing mutation
    cmds:
      - python3 scripts/verify-live-action-lifecycle.py --report docs/Ver.0.1.5/live-action-lifecycle-verification.json

  kugnus:aiops:verify:
    desc: Run the offline Ver.0.1.9 three-reviewer AIOps gate with at least five checks
    cmds:
      - python3 scripts/verify-aiops-review-gate.py

  kugnus:aiops:live-verify:
    desc: Run the live Ver.0.1.9 AIOps gate that requires VPN, local console bridge, Gateway, and OCP access
    cmds:
      - cd komsco-ai-console-plugin && ./node_modules/.bin/tsc --noEmit
      - task: kugnus:ui:verify
      - komsco-ai-gateway/.venv/bin/python -m pytest komsco-ai-gateway/tests/test_health.py -q -k "chat_stream_emits_rca_context_event or actions_api_rejects_stale_approval_and_blocks_disabled_execution or action_executor_rejects_missing_or_mismatched_execution_grant"
      - task: kugnus:scenario:verify
      - task: kugnus:runtime:smoke
      - task: kugnus:actions:live-verify
      - task: kugnus:lightspeed:live-verify
      - task: kugnus:package

