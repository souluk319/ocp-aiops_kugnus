apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - lightspeed-networkpolicy.yaml
  - namespace.yaml
images:
  - name: komsco-ai-gateway
    newName: image-registry.openshift-image-registry.svc:5000/komsco-ai-dev/komsco-ai-gateway
    newTag: dev
patches:
  - target:
      kind: ServiceAccount
      name: komsco-ai-action-executor
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Service
      name: komsco-ai-action-executor
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Deployment
      name: komsco-ai-action-executor
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: NetworkPolicy
      name: komsco-ai-action-executor-ingress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: ClusterRoleBinding
      name: komsco-ai-action-executor
    patch: |-
      - op: replace
        path: /metadata/name
        value: komsco-ai-dev-action-executor
      - op: replace
        path: /subjects/0/namespace
        value: komsco-ai-dev
  - target:
      kind: ServiceAccount
      name: komsco-ai-gateway
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: ConfigMap
      name: komsco-ai-service-ca
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Service
      name: komsco-ai-gateway
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Deployment
      name: komsco-ai-gateway
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "true"
  - target:
      kind: NetworkPolicy
      name: komsco-ai-gateway-ingress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: ClusterRoleBinding
      name: komsco-ai-gateway-auth-delegator
    patch: |-
      - op: replace
        path: /metadata/name
        value: komsco-ai-dev-gateway-auth-delegator
      - op: replace
        path: /subjects/0/namespace
        value: komsco-ai-dev
  - target:
      kind: Role
      name: komsco-ai-gateway-ledger
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: RoleBinding
      name: komsco-ai-gateway-ledger
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
      - op: replace
        path: /subjects/0/namespace
        value: komsco-ai-dev
  - target:
      kind: ServiceAccount
      name: komsco-ai-host-diagnostics-controller
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: ServiceAccount
      name: komsco-ai-host-diagnostics-runner
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Role
      name: komsco-ai-host-diagnostics-controller
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: RoleBinding
      name: komsco-ai-host-diagnostics-controller
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
      - op: replace
        path: /subjects/0/namespace
        value: komsco-ai-dev
  - target:
      kind: Service
      name: komsco-ai-host-diagnostics-controller
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: Deployment
      name: komsco-ai-host-diagnostics-controller
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: image-registry.openshift-image-registry.svc:5000/komsco-ai-dev/komsco-ai-gateway:dev
  - target:
      kind: NetworkPolicy
      name: komsco-ai-host-diagnostics-controller-ingress
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
  - target:
      kind: RoleBinding
      name: komsco-ai-host-diagnostics-runner-scc
    patch: |-
      - op: add
        path: /metadata/namespace
        value: komsco-ai-dev
      - op: replace
        path: /subjects/0/namespace
        value: komsco-ai-dev
