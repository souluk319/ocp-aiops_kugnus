plugin:
  name: komsco-ai-console-plugin
  displayName: KOMSCO AI Assistant
  description: KOMSCO AI assistant for OpenShift operations.
  image: image-registry.openshift-image-registry.svc:5000/komsco-ai/komsco-ai-console-plugin:0.1.3
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 9443
  applicationMenu:
    enabled: true
    name: komsco-aiops-application-menu
    section: Cywell
    text: AIOps
    href: https://console-openshift-console.apps.ocp.cywell.server/aiops-kugnus
  gateway:
    name: komsco-ai-gateway
    namespace: komsco-ai
    port: 8443
