apiVersion: apps/v1
kind: Deployment
metadata:
  name: komsco-ai-host-diagnostics-controller
  labels:
    app: komsco-ai-host-diagnostics-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: komsco-ai-host-diagnostics-controller
  template:
    metadata:
      labels:
        app: komsco-ai-host-diagnostics-controller
    spec:
      serviceAccountName: komsco-ai-host-diagnostics-controller
      containers:
        - name: host-diagnostics-controller
          image: komsco-ai-gateway:dev
          imagePullPolicy: Always
          command:
            - uvicorn
          args:
            - komsco_ai_gateway.host_diagnostics_controller:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KOMSCO_AI_HOST_DIAGNOSTICS_CONTROLLER_ENABLED
              value: "true"
            - name: KOMSCO_AI_HOST_DIAGNOSTICS_RUNNER_IMAGE
              value: "komsco-ai-gateway:dev"
            - name: KOMSCO_AI_HOST_DIAGNOSTICS_RUNNER_SERVICE_ACCOUNT
              value: "komsco-ai-host-diagnostics-runner"
            - name: OPENSHIFT_API_CA_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
