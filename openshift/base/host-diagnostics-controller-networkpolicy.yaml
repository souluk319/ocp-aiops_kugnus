apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: komsco-ai-host-diagnostics-controller-ingress
spec:
  podSelector:
    matchLabels:
      app: komsco-ai-host-diagnostics-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: komsco-ai-gateway
      ports:
        - port: 8080
          protocol: TCP
