apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: komsco-ai-action-executor
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
      - replicasets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/eviction
    verbs:
      - create
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: komsco-ai-action-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: komsco-ai-action-executor
subjects:
  - kind: ServiceAccount
    name: komsco-ai-action-executor
    namespace: default
