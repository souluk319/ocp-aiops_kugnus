apiVersion: v1
kind: Service
metadata:
  name: komsco-ai-gateway
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: komsco-ai-gateway-tls
  labels:
    app: komsco-ai-gateway
spec:
  selector:
    app: komsco-ai-gateway
  ports:
    - name: https
      port: 8443
      targetPort: https
