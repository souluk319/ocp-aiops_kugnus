apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: komsco-ai-host-diagnostics-controller
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: komsco-ai-host-diagnostics-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: komsco-ai-host-diagnostics-controller
subjects:
  - kind: ServiceAccount
    name: komsco-ai-host-diagnostics-controller
    namespace: default
