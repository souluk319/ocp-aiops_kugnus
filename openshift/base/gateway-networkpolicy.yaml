apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: komsco-ai-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app: komsco-ai-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - port: 8443
          protocol: TCP
